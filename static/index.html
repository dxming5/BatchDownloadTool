<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main>
    <div class="col-left">
      <section class="card">
        <div class="card-head">
          <h2>下载</h2>
          <div class="row tight">
            <select id="downloadMode" class="select select-sm"
                    title="选择下载方式：粘贴链接，或读取本机登录账号的关注列表">
              <option value="link">链接下载</option>
              <option value="following">关注列表下载</option>
            </select>
          </div>
        </div>

        <!-- 方式一：链接下载 -->
        <div id="linkPane" class="mode-pane">
          <p class="hint">
            粘贴博主主页链接，每行一个，可一次粘贴多个（依次执行）。
          </p>
          <div class="row tight">
            <textarea id="userUrl" rows="3" spellcheck="false"
                      placeholder="https://www.douyin.com/user/MS4wLjABAAAA...
https://www.xiaohongshu.com/user/profile/xxxxxxxx
https://m.weibo.cn/u/xxxxxxxxxx"></textarea>
          </div>
        </div>

        <!-- 方式二：关注列表下载 -->
        <div id="followingPane" class="mode-pane hidden">
          <p class="hint">
            读取本机已登录账号的关注列表，勾选后下载。
          </p>
          <div class="following-box">
            <div class="row following-row">
              <select id="followingPlatform" class="select select-sm hidden"
                      title="从哪个平台读取本机登录账号的关注列表"></select>
              <button id="followingBtn" class="ghost" disabled>获取我的关注</button>
              <button id="followingToggle" class="ghost hidden" aria-expanded="false"
                      title="展开 / 收起关注列表">
                关注列表（<span id="followingCount">0</span>）
                <span class="chevron"></span>
              </button>
              <span class="hint" id="followingEmpty">尚未读取关注列表</span>
              <span class="hint picked hidden" id="followingPicked">已选 0 位</span>
              <span class="hint hidden" id="followingHint"></span>
            </div>

            <!-- 下拉浮层：绝对定位，展开不改变页面高度 -->
            <div id="followingBox" class="following-popover hidden">
              <div class="following-popover-head">
                <label class="hint"><input type="checkbox" id="followingAll"> 全选</label>
                <button id="followingClose" class="ghost" type="button">收起</button>
              </div>
              <div id="followingList" class="following-list"></div>
            </div>
          </div>
        </div>

        <!-- 两种方式共用：下载范围 + 动作（输入区等高，位置固定） -->
        <div class="row actions-row">
          <select id="rangeSelect" class="select">
            <option value="all">全部作品</option>
            <option value="month">最近一个月</option>
          </select>
          <span class="spacer"></span>
          <button id="downloadBtn" class="primary">下载</button>
          <button id="cancelBtn" class="ghost danger" disabled>取消任务</button>
        </div>

        <div class="divider"></div>

        <div class="progress-row">
          <div class="progress">
            <div id="bar" class="bar" style="width:0%"></div>
          </div>
          <span id="progressText" class="progress-text">0%（0/0）</span>
        </div>
        <pre id="logBox" class="log">等待任务…</pre>
        <details id="failureBox" class="hidden">
          <summary>下载失败（<span id="failureCount">0</span>）</summary>
          <ul id="failureList" class="failures"></ul>
        </details>
      </section>

      <section class="card card-bloggers">
        <div class="card-head">
          <h2>博主管理</h2>
          <div class="row tight">
            <select id="platformFilter" class="select select-sm"
                    title="按平台筛选博主"></select>
            <button id="updateAllBtn" class="ghost">更新</button>
            <button id="refreshBtn" class="ghost">刷新</button>
          </div>
        </div>
        <div id="bloggers" class="bloggers">
          <p class="empty">暂无博主</p>
        </div>
      </section>
    </div>

    <div class="col-preview">
      <section class="card card-preview">
        <div class="card-head">
          <h2 id="galleryTitle">预览</h2>
          <div class="gallery-tools">
            <div id="galleryTabs" class="tabs hidden">
              <button class="tab active" data-kind="image" type="button">图片</button>
              <button class="tab" data-kind="video" type="button">视频</button>
            </div>
            <button id="galleryRefresh" class="ghost hidden" type="button"
                    title="重新读取该博主的图片和视频">刷新</button>
          </div>
        </div>
        <div id="gallery" class="gallery hidden"></div>
        <div id="galleryEmpty" class="gallery-empty">
          <span>点击左侧博主列表中的博主查看作品，默认显示图片，可切换为视频</span>
        </div>
      </section>
    </div>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lbClose" class="lb-btn lb-close" title="关闭（Esc）">✕</button>
    <button id="lbEdgePrev" class="lb-edge lb-edge-prev" title="上一个（←）">‹</button>
    <button id="lbEdgeNext" class="lb-edge lb-edge-next" title="下一个（→）">›</button>
    <img id="lbImg" alt="">
    <video id="lbVideo" class="hidden" controls playsinline preload="metadata"></video>
    <div class="lb-bar">
      <div class="lb-ctrl">
        <span id="lbCounter"></span>
      </div>
      <span id="lbCaption" class="mono"></span>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-panel">
      <p id="confirmText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="ghost">取消</button>
        <button id="confirmOk" class="primary">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>

</html>
