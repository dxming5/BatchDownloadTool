<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音批量下载器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">DY</span>
      <div>
        <h1>抖音视频 / 图片 批量下载</h1>
        <p class="sub">本地运行 · 数据不出本机</p>
      </div>
    </div>
  </header>

  <main>
    <div class="col-left">
      <section class="card">
        <div class="card-head">
          <h2>下载</h2>
        </div>
        <p class="hint">
          粘贴博主主页链接，自动抓取作品并下载（抓取后直接开始下载，无需再手动操作）。
        </p>
        <div class="row tight">
          <input id="userUrl" type="text" spellcheck="false"
                 placeholder="https://www.douyin.com/user/MS4wLjABAAAA...">
        </div>
        <div class="row">
          <select id="rangeSelect" class="select">
            <option value="all">全部作品</option>
            <option value="month">最近一个月</option>
          </select>
          <span class="spacer"></span>
          <button id="scrapeBtn" class="primary">抓取并下载</button>
        </div>
        <p class="hint">
          登录态缓存在本机，无需每次扫码；若尚未登录，会等待最多 3 分钟以便在弹出的浏览器窗口里扫码。
        </p>

        <div class="divider"></div>

        <div class="progress">
          <div id="bar" class="bar" style="width:0%"></div>
        </div>
        <div class="row tight progress-meta">
          <span id="parseInfo" class="hint"></span>
          <span class="spacer"></span>
          <span id="progressText" class="hint">空闲中</span>
        </div>
        <div class="row">
          <span id="currentFile" class="hint mono"></span>
          <span class="spacer"></span>
          <button id="cancelBtn" class="ghost danger" disabled>取消任务</button>
        </div>
        <pre id="logBox" class="log">等待任务…</pre>
        <details id="failureBox" class="hidden">
          <summary>下载失败（<span id="failureCount">0</span>）</summary>
          <ul id="failureList" class="failures"></ul>
        </details>
      </section>

      <section class="card card-bloggers">
        <div class="card-head">
          <h2>博主管理</h2>
          <div class="row tight">
            <span id="bloggerHint" class="hint"></span>
            <button id="refreshBtn" class="ghost">刷新</button>
          </div>
        </div>
        <div id="bloggers" class="bloggers">
          <p class="empty">暂无博主</p>
        </div>
      </section>
    </div>

    <div class="col-preview">
      <section class="card card-preview">
        <div class="card-head">
          <h2 id="galleryTitle">预览</h2>
          <button id="galleryClose" class="ghost hidden">收起</button>
        </div>
        <div id="gallery" class="gallery hidden"></div>
        <div id="galleryEmpty" class="gallery-empty">
          <span>在左侧博主列表点击「图片」或「视频」查看预览</span>
        </div>
      </section>
    </div>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lbClose" class="lb-btn lb-close" title="关闭（Esc）">✕</button>
    <button id="lbEdgePrev" class="lb-edge lb-edge-prev" title="上一个（←）">‹</button>
    <button id="lbEdgeNext" class="lb-edge lb-edge-next" title="下一个（→）">›</button>
    <img id="lbImg" alt="">
    <video id="lbVideo" class="hidden" controls playsinline preload="metadata"></video>
    <div class="lb-bar">
      <div class="lb-ctrl">
        <span id="lbCounter"></span>
      </div>
      <span id="lbCaption" class="mono"></span>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>

</html>
