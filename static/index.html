<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抖音批量下载器</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">DY</span>
      <div>
        <h1>抖音视频 / 图片 批量下载</h1>
        <p class="sub">本地运行 · 数据不出本机</p>
      </div>
    </div>
    <div class="topbar-right">
      <button id="dirBtn" class="pill" title="点击修改下载目录">下载目录加载中…</button>
      <button id="settingsBtn" class="ghost">设置</button>
    </div>
  </header>

  <main>
    <div class="col-left">
      <section class="card">
        <div class="card-head">
          <h2><span class="num">1</span> 下载</h2>
          <div class="row tight">
            <span id="logInfo" class="hint"></span>
            <span id="parseInfo" class="hint"></span>
            <span id="progressText" class="hint">空闲中</span>
          </div>
        </div>
        <p class="hint">
          打开抖音网页版 → 博主主页 → F12 → Network → 找到含 <code>aweme_list</code> 的 fetch/xhr 请求，
          把每页 Response 一行一条粘贴到下面。数据只保存在内存（上限 100 MB），重启服务后需重新导入。
        </p>
        <textarea id="jsonText" spellcheck="false" placeholder='{"aweme_list": [ ... ]}'></textarea>
        <div class="row">
          <button id="parseBtn" class="primary">开始下载</button>
          <button id="clearLogBtn" class="ghost danger">清空数据</button>
        </div>
        <div id="bloggerBox" class="hidden">
          <div id="bloggerChoices" class="choices"></div>
          <div class="row">
            <input id="nameInput" placeholder="博主名称（可修改，作为文件夹名）">
            <button id="downloadBtn" class="primary">开始下载</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="progress">
          <div id="bar" class="bar" style="width:0%"></div>
        </div>
        <div class="row">
          <span id="currentFile" class="hint mono"></span>
          <span class="spacer"></span>
          <button id="cancelBtn" class="ghost danger" disabled>取消任务</button>
        </div>
        <pre id="logBox" class="log">等待任务…</pre>
        <details id="failureBox" class="hidden">
          <summary>下载失败（<span id="failureCount">0</span>）</summary>
          <ul id="failureList" class="failures"></ul>
        </details>
      </section>
    </div>

    <div class="col-right">
      <section class="card">
        <div class="card-head">
          <h2><span class="num">2</span> 博主管理</h2>
          <div class="row tight">
            <span id="bloggerHint" class="hint"></span>
            <button id="refreshBtn" class="ghost">刷新</button>
          </div>
        </div>
        <div id="bloggers" class="bloggers">
          <p class="empty">暂无博主</p>
        </div>
        <div id="gallery" class="gallery hidden"></div>
      </section>
    </div>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-body">
      <h3>设置</h3>
      <label class="field">
        <span>下载目录</span>
        <input id="setDir" placeholder="例如 F:/图片/douyin/">
      </label>
      <label class="field">
        <span>User-Agent</span>
        <input id="setUA" placeholder="浏览器 User-Agent">
      </label>
      <p class="hint">保存后写入 settings.json，重启后仍然生效；下载目录会立即切换。</p>
      <div class="row end">
        <button id="settingsCancel" class="ghost">取消</button>
        <button id="settingsSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button id="lbClose" class="lb-btn lb-close" title="关闭（Esc）">✕</button>
    <img id="lbImg" alt="">
    <video id="lbVideo" class="hidden" controls playsinline preload="metadata"></video>
    <div class="lb-bar">
      <div class="lb-ctrl">
        <button id="lbPrev" class="lb-btn" title="上一张（←）">‹</button>
        <span id="lbCounter"></span>
        <button id="lbNext" class="lb-btn" title="下一张（→）">›</button>
      </div>
      <span id="lbCaption" class="mono"></span>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>

</html>
