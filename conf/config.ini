# ============================================================
# 下载器 · 统一配置文件
# 以 # 或 ; 开头的行是注释；修改后重启程序生效
# ============================================================

[download]
# 下载根目录；必须可创建，否则程序报错退出
# 实际布局：下载根/平台目录/博主名/...
# 从旧版升级：原下载根（如 F:/图片/douyin/）在这里去掉最后一级即可，
# 原来的博主目录会直接变成 douyin 平台目录，无需移动任何文件。
download_dir = F:/图片/
# 单个 URL 的下载超时（秒）
timeout = 30
# 下载失败后的重试次数
max_retry = 3

[network]
# false 表示忽略 SSL 证书校验（抖音站点通常需要）
verify_ssl = false

[network.header]
# 下载请求的公共头；各平台在自己的段里用 referer / accept 覆盖
User-Agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36 Edg/157.0.0.0
Accept = application/json, text/plain, */*

[web]
# 只应绑定 127.0.0.1，避免无鉴权接口暴露到局域网
host = 127.0.0.1
# Web 服务端口；被占用时自动向后顺延
port = 5000
# 顺延查找的端口数量
port_range = 10
# 浏览器标签标题
title = 批量下载器

[platforms.default]
# 所有平台共用的抓取参数；平台段没写的项都从这里取
# 是否无头运行；首次登录需设为 false 才能看到窗口扫码
headless = true
# 浏览器用户数据目录（保存登录态），留空 = 项目根/.pw_profile_*
profile_dir =
# 未登录时等待人工扫码登录的秒数，0 表示不等待
wait_login_seconds = 180
# 最大滚动次数，防止死循环
max_scroll = 400
# 连续多少次滚动没有新内容就停止
idle_rounds = 8
# 「最近一个月」选项对应的天数
month_days = 30
# 浏览器通道：留空用内置 Chromium，可填 msedge / chrome
browser_channel =
# 代理，如 http://127.0.0.1:7890；留空表示不使用
proxy =
# 页面加载超时（毫秒）
timeout_ms = 30000

[platforms.douyin]
# 下载请求头里的 Referer；留空则不带该头（CDN 可能拒绝）
referer = https://www.douyin.com/
# 判定为图片内容的 aweme type，逗号分隔
image_types = 68
# 判定为视频内容的 aweme type，逗号分隔
video_types = 0,51,55,61,66

[platforms.xiaohongshu]
# 下载请求头里的 Referer；留空则不带该头（CDN 可能拒绝）
referer = https://www.xiaohongshu.com/
# 图片 CDN 要求 Accept 为 */*
accept = */*
