# ============================================================
# 下载器 · 统一配置文件
# 以 # 或 ; 开头的行是注释；修改后重启程序生效
# ============================================================

[download]
# 下载根目录；必须可创建，否则程序报错退出
# 实际布局：下载根/平台目录/博主名/...
# 从旧版升级：原下载根（如 F:/图片/douyin/）在这里去掉最后一级即可，
# 原来的博主目录会直接变成 douyin 平台目录，无需移动任何文件。
download_dir = F:/图片/
# 单个 URL 的下载超时（秒）
timeout = 30
# 下载失败后的重试次数
max_retry = 3
# 同时下载的 URL 数；1 表示逐个下载（旧行为）
# 过大会被 CDN 限流，建议 3~4
workers = 1

[network]
# false 表示忽略 SSL 证书校验（抖音站点通常需要）
verify_ssl = false

[network.header]
# 下载请求的公共头；各平台在自己的段里用 referer / accept 覆盖
User-Agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36 Edg/157.0.0.0
Accept = application/json, text/plain, */*

[web]
# 只应绑定 127.0.0.1，避免无鉴权接口暴露到局域网
host = 127.0.0.1
# Web 服务端口；被占用时自动向后顺延
port = 5000
# 顺延查找的端口数量
port_range = 10
# 浏览器标签标题
title = 批量下载器

[platforms.default]
# 所有平台共用的抓取参数；平台段没写的项都从这里取
# 是否无头运行；首次登录需设为 false 才能看到窗口扫码
headless = false
# 浏览器用户数据目录（保存登录态），留空 = 项目根/.pw_profile/<平台 key>
profile_dir =
# 未登录时等待人工扫码登录的秒数，0 表示不等待
wait_login_seconds = 180
# 最大滚动次数，防止死循环（微博按「翻页次数」使用该值，每页约 10 条）
max_scroll = 400
# 连续多少次滚动没有新内容就停止
# 只统计「接口没有请求在飞、页面也没有加载态」的轮次，慢网不会被误判成已到底
idle_rounds = 8
# 滚动后等新数据的基础窗口（秒）：覆盖「滚动 → 抖音发请求」的延迟
page_wait_seconds = 2.0
# 单次翻页最长等待（秒）：接口还在返回、页面还在骨架屏时可以一直等，上限即此值
page_load_timeout = 30
# 「最近一个月」选项对应的天数
month_days = 30
# 浏览器通道：留空用内置 Chromium，可填 msedge / chrome
browser_channel =
# 代理，如 http://127.0.0.1:7890；留空表示不使用
proxy =
# 页面加载超时（毫秒）
timeout_ms = 30000
# 关注列表最多翻多少页，防止接口异常时死循环
following_max_scroll = 200
# 关注列表最多取多少人，0 表示不限
following_limit = 0
# 关注列表翻页间隔（秒），过小容易被风控
following_interval = 1.0

[platforms.douyin]
# 下载请求头里的 Referer；留空则不带该头（CDN 可能拒绝）
referer = https://www.douyin.com/
# 判定为图片内容的 aweme type，逗号分隔
image_types = 68
# 判定为视频内容的 aweme type，逗号分隔
video_types = 0,51,55,61,66

[platforms.xiaohongshu]
# 下载请求头里的 Referer；留空则不带该头（CDN 可能拒绝）
referer = https://www.xiaohongshu.com/
# 图片 CDN 要求 Accept 为 */*
accept = */*

[platforms.weibo]
# 下载请求头里的 Referer；图片返回 403 时可改成 https://weibo.com/
referer = https://m.weibo.cn/
