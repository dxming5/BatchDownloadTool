# ============================================================
# 抖音下载器 · 统一配置文件
# 以 # 或 ; 开头的行是注释；修改后重启程序生效
# ============================================================

[download]
# 下载根目录；必须可创建，否则程序报错退出
download_dir = F:/图片/douyin/
# 判定为图片内容的 aweme type，逗号分隔
image_types = 68
# 判定为视频内容的 aweme type，逗号分隔
video_types = 0,51,55,61,66
# 单个 URL 的下载超时（秒）
timeout = 30
# 下载失败后的重试次数
max_retry = 3

[network]
# false 表示忽略 SSL 证书校验（抖音站点通常需要）
verify_ssl = false

[network.header]
# HTTP 请求头，可按需增删条目
User-Agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36 Edg/157.0.0.0
Accept = application/json, text/plain, */*
Referer = https://www.douyin.com/

[web]
# 只应绑定 127.0.0.1，避免无鉴权接口暴露到局域网
host = 127.0.0.1
# Web 服务端口；被占用时自动向后顺延
port = 5000
# 顺延查找的端口数量
port_range = 10
# 导入数据的内存上限（MB）
import_memory_limit_mb = 100
